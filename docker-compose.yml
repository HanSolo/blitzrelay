services:
  blitzrelay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blitzrelay
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MQTT_HOST=host.docker.internal
      - MQTT_PORT=1883
      - MQTT_TOPIC=lightning/strikes
    logging:
      driver: journald
      options:
        tag: blitzrelay
    mem_limit: 128m
    cpus: "0.1"
